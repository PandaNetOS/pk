# =============================================================================
# PandaNetOS 生态合规检查 CI
# =============================================================================
name: PandaNetOS Compliance

on:
  pull_request:
    branches: [main]

jobs:
  compliance:
    name: Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本项目
        uses: actions/checkout@v4

      - name: Checkout PandaNetOS 标准规范仓（合规脚本来源）
        run: |
          git clone --depth 1 https://github.com/PandaNetOS/PandaNetOS.git ../PandaNetOS

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ../PandaNetOS

      - name: 运行 PandaNetOS 合规检查
        run: bash ../PandaNetOS/scripts/check_compliance.sh .

      - name: 上传检查日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-log
          path: |
            **/Cargo.toml
            README.md
          retention-days: 7
